<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 RGB Control (LCH)</title>
<style>
  body { font-family: sans-serif; background:#111; color:#eee; text-align:center; padding:16px; }
  input[type=color] { width:100px; height:56px; border:none; border-radius:12px; }
  #preview { width:100%; max-width:280px; height:44px; margin:14px auto; border-radius:10px; border:1px solid #444; }
  .graphs { display:flex; flex-wrap:wrap; justify-content:center; gap:18px; }
  .graph-block { display:inline-block; }
  .graph-wrap { position:relative; width:220px; height:220px; margin:0 auto; }
  canvas.gamut { border-radius:8px; border:1px solid #444; cursor:crosshair; touch-action:none; display:block; }
  .marker {
    position:absolute; width:12px; height:12px; border:2px solid #fff; border-radius:50%;
    box-shadow:0 0 3px #000; transform:translate(-50%,-50%); pointer-events:none;
  }
  .axis-label { font-size:11px; color:#888; margin-bottom:4px; }
  .graph-title { font-size:13px; color:#ccc; margin-bottom:2px; font-weight:bold; }
  .readout { font-size:12px; color:#999; margin-top:4px; }
  button { margin-top:14px; padding:8px 14px; border-radius:8px; border:none; background:#333; color:#eee; cursor:pointer; }
  #gamutWarn { font-size:12px; color:#e88; min-height:16px; }
</style>
</head>
<body>
<h2>ESP32 RGB LED Control &mdash; LCH</h2>

<input type="color" id="picker" value="#000000">
<div id="preview"></div>
<div id="gamutWarn"></div>

<div class="graphs">
  <div class="graph-block">
    <div class="graph-title">Hue &times; Chroma</div>
    <div class="axis-label">L fixed &mdash; <span id="lFixedLabel">50</span></div>
    <div class="graph-wrap">
      <canvas class="gamut" id="canvasHC" width="220" height="220"></canvas>
      <div class="marker" id="markerHC"></div>
    </div>
    <div class="readout">H &rarr; / C &uarr;</div>
  </div>

  <div class="graph-block">
    <div class="graph-title">Lightness &times; Chroma</div>
    <div class="axis-label">H fixed &mdash; <span id="hFixedLabel">0</span></div>
    <div class="graph-wrap">
      <canvas class="gamut" id="canvasLC" width="220" height="220"></canvas>
      <div class="marker" id="markerLC"></div>
    </div>
    <div class="readout">L &rarr; / C &uarr;</div>
  </div>

  <div class="graph-block">
    <div class="graph-title">Lightness &times; Hue</div>
    <div class="axis-label">C fixed &mdash; <span id="cFixedLabel">0</span></div>
    <div class="graph-wrap">
      <canvas class="gamut" id="canvasLH" width="220" height="220"></canvas>
      <div class="marker" id="markerLH"></div>
    </div>
    <div class="readout">L &rarr; / H &uarr;</div>
  </div>
</div>

<div>
  <button onclick="setColorHex('#ff0000')">Red</button>
  <button onclick="setColorHex('#00ff00')">Green</button>
  <button onclick="setColorHex('#0000ff')">Blue</button>
  <button onclick="setColorHex('#ffffff')">White</button>
  <button onclick="setColorHex('#000000')">Off</button>
</div>

<script>
/* ---------- Color science: LCH(ab) <-> sRGB, D65 white point ---------- */
const Xn = 95.047, Yn = 100.0, Zn = 108.883;
const EPS = 0.008856, KAPPA = 903.3;
const MAX_C = 132; // approx practical max chroma for sRGB gamut in Lab

function lchToLab(L, C, H) {
  const hr = H * Math.PI / 180;
  return [L, C * Math.cos(hr), C * Math.sin(hr)];
}
function labToLch(L, a, b) {
  const C = Math.sqrt(a*a + b*b);
  let H = Math.atan2(b, a) * 180 / Math.PI;
  if (H < 0) H += 360;
  return [L, C, H];
}
function labToXyz(L, a, b) {
  const fy = (L + 16) / 116;
  const fx = fy + a / 500;
  const fz = fy - b / 200;
  const fx3 = fx*fx*fx, fz3 = fz*fz*fz;
  const xr = fx3 > EPS ? fx3 : (116*fx - 16) / KAPPA;
  const yr = L > KAPPA*EPS ? Math.pow((L+16)/116, 3) : L / KAPPA;
  const zr = fz3 > EPS ? fz3 : (116*fz - 16) / KAPPA;
  return [xr*Xn, yr*Yn, zr*Zn];
}
function xyzToLab(X, Y, Z) {
  const f = t => t > EPS ? Math.cbrt(t) : (KAPPA*t + 16) / 116;
  const fx = f(X/Xn), fy = f(Y/Yn), fz = f(Z/Zn);
  return [116*fy - 16, 500*(fx-fy), 200*(fy-fz)];
}
function xyzToLinearRgb(X, Y, Z) {
  X/=100; Y/=100; Z/=100;
  return [
     3.2406*X - 1.5372*Y - 0.4986*Z,
    -0.9689*X + 1.8758*Y + 0.0415*Z,
     0.0557*X - 0.2040*Y + 1.0570*Z
  ];
}
function rgbLinearToXyz(r, g, b) {
  const X = 0.4124*r + 0.3576*g + 0.1805*b;
  const Y = 0.2126*r + 0.7152*g + 0.0722*b;
  const Z = 0.0193*r + 0.1192*g + 0.9505*b;
  return [X*100, Y*100, Z*100];
}
function gammaEncode(c) {
  return c <= 0.0031308 ? 12.92*c : 1.055*Math.pow(c, 1/2.4) - 0.055;
}
function gammaDecode(c) {
  return c <= 0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
}
function lchToRgb(L, C, H) {
  const [Lab_L, a, b] = lchToLab(L, C, H);
  const [X, Y, Z] = labToXyz(Lab_L, a, b);
  const [rl, gl, bl] = xyzToLinearRgb(X, Y, Z);
  const r = gammaEncode(rl), g = gammaEncode(gl), bch = gammaEncode(bl);
  const outOfGamut = [r,g,bch].some(v => v < -0.001 || v > 1.001);
  const clamp = v => Math.round(Math.min(1, Math.max(0, v)) * 255);
  return { rgb: [clamp(r), clamp(g), clamp(bch)], outOfGamut };
}
function rgbToLch(r, g, b) {
  const rl = gammaDecode(r/255), gl = gammaDecode(g/255), bl = gammaDecode(b/255);
  const [X, Y, Z] = rgbLinearToXyz(rl, gl, bl);
  const [L, a, bb] = xyzToLab(X, Y, Z);
  return labToLch(L, a, bb);
}

/* ---------- State ---------- */
let curL = 50, curC = 40, curH = 0;

/* ---------- DOM refs ---------- */
const picker = document.getElementById('picker');
const preview = document.getElementById('preview');
const gamutWarn = document.getElementById('gamutWarn');

const canvasHC = document.getElementById('canvasHC'), ctxHC = canvasHC.getContext('2d'), markerHC = document.getElementById('markerHC');
const canvasLC = document.getElementById('canvasLC'), ctxLC = canvasLC.getContext('2d'), markerLC = document.getElementById('markerLC');
const canvasLH = document.getElementById('canvasLH'), ctxLH = canvasLH.getContext('2d'), markerLH = document.getElementById('markerLH');

const lFixedLabel = document.getElementById('lFixedLabel');
const hFixedLabel = document.getElementById('hFixedLabel');
const cFixedLabel = document.getElementById('cFixedLabel');

/* ---------- Plane renderers ----------
   Each plane is drawn independently; only the two dragged axes are used
   as pixel coordinates, the third stays at its current fixed value. */
function drawPlane(ctx, w, hgt, xFn, yFn, computeRgb) {
  const img = ctx.createImageData(w, hgt);
  for (let py = 0; py < hgt; py++) {
    const yVal = yFn(py, hgt);
    for (let px = 0; px < w; px++) {
      const xVal = xFn(px, w);
      const { rgb, outOfGamut } = computeRgb(xVal, yVal);
      const idx = (py * w + px) * 4;
      if (outOfGamut) {
        img.data[idx]=24; img.data[idx+1]=24; img.data[idx+2]=24; img.data[idx+3]=255;
      } else {
        img.data[idx]=rgb[0]; img.data[idx+1]=rgb[1]; img.data[idx+2]=rgb[2]; img.data[idx+3]=255;
      }
    }
  }
  ctx.putImageData(img, 0, 0);
}

function redrawHC() {
  drawPlane(ctxHC, canvasHC.width, canvasHC.height,
    (px,w) => (px/(w-1))*360,               // x = Hue 0-360
    (py,h) => (1 - py/(h-1)) * MAX_C,       // y = Chroma, top = max
    (H,C) => lchToRgb(curL, C, H));
  lFixedLabel.textContent = Math.round(curL);
}
function redrawLC() {
  drawPlane(ctxLC, canvasLC.width, canvasLC.height,
    (px,w) => (px/(w-1))*100,               // x = L 0-100
    (py,h) => (1 - py/(h-1)) * MAX_C,       // y = Chroma
    (L,C) => lchToRgb(L, C, curH));
  hFixedLabel.textContent = Math.round(curH);
}
function redrawLH() {
  drawPlane(ctxLH, canvasLH.width, canvasLH.height,
    (px,w) => (px/(w-1))*100,               // x = L 0-100
    (py,h) => (1 - py/(h-1)) * 360,         // y = Hue 0-360
    (L,H) => lchToRgb(L, curC, H));
  cFixedLabel.textContent = Math.round(curC);
}

function positionMarker(markerEl, canvasEl, xFrac, yFrac) {
  markerEl.style.left = (canvasEl.offsetLeft + xFrac * canvasEl.width) + 'px';
  markerEl.style.top  = (canvasEl.offsetTop  + yFrac * canvasEl.height) + 'px';
}
function updateAllMarkers() {
  positionMarker(markerHC, canvasHC, curH/360, 1 - curC/MAX_C);
  positionMarker(markerLC, canvasLC, curL/100, 1 - curC/MAX_C);
  positionMarker(markerLH, canvasLH, curL/100, 1 - curH/360);
}

function redrawAll() {
  redrawHC(); redrawLC(); redrawLH();
  updateAllMarkers();
}

function applyAndSend() {
  const { rgb, outOfGamut } = lchToRgb(curL, curC, curH);
  preview.style.background = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
  gamutWarn.textContent = outOfGamut ? 'Requested color is outside displayable range \u2014 showing closest match' : '';
  fetch(`/set?r=${rgb[0]}&g=${rgb[1]}&b=${rgb[2]}`);
}

// Called after the user drags on a graph and two axes change.
// Redraws only the OTHER two graphs (their fixed axis just moved) plus markers.
function afterChange(changedAxes) {
  if (changedAxes.has('L') || changedAxes.has('C')) redrawHC();
  if (changedAxes.has('L') || changedAxes.has('H')) redrawLC();
  if (changedAxes.has('C') || changedAxes.has('H')) redrawLH();
  updateAllMarkers();
  applyAndSend();
}

/* ---------- Drag handling per canvas ---------- */
function attachDrag(canvasEl, onMove) {
  let dragging = false;
  function handle(e) {
    const rect = canvasEl.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    let px = clientX - rect.left, py = clientY - rect.top;
    px = Math.min(Math.max(px, 0), canvasEl.width - 1);
    py = Math.min(Math.max(py, 0), canvasEl.height - 1);
    onMove(px / canvasEl.width, py / canvasEl.height);
  }
  canvasEl.addEventListener('mousedown', e => { dragging = true; handle(e); });
  window.addEventListener('mousemove', e => { if (dragging) handle(e); });
  window.addEventListener('mouseup', () => dragging = false);
  canvasEl.addEventListener('touchstart', e => { dragging = true; handle(e); e.preventDefault(); });
  canvasEl.addEventListener('touchmove', e => { if (dragging) handle(e); e.preventDefault(); });
  canvasEl.addEventListener('touchend', () => dragging = false);
}

attachDrag(canvasHC, (xFrac, yFrac) => {
  curH = xFrac * 360;
  curC = (1 - yFrac) * MAX_C;
  afterChange(new Set(['H','C']));
});
attachDrag(canvasLC, (xFrac, yFrac) => {
  curL = xFrac * 100;
  curC = (1 - yFrac) * MAX_C;
  afterChange(new Set(['L','C']));
});
attachDrag(canvasLH, (xFrac, yFrac) => {
  curL = xFrac * 100;
  curH = (1 - yFrac) * 360;
  afterChange(new Set(['L','H']));
});

function setColorHex(hex) {
  picker.value = hex;
  const r = parseInt(hex.substr(1,2),16);
  const g = parseInt(hex.substr(3,2),16);
  const b = parseInt(hex.substr(5,2),16);
  const [L, C, H] = rgbToLch(r, g, b);
  curL = L; curC = C; curH = H;
  redrawAll();
  applyAndSend();
}
picker.addEventListener('input', () => setColorHex(picker.value));

// initial render
redrawAll();
</script>
</body>
</html>
