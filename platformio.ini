; PlatformIO project for ESP32-WROOM 4-channel relay controller
;
; Platform version is pinned deliberately. The Arduino-ESP32 core went through
; a breaking LEDC (PWM) API change between core 2.x and 3.x (ledcSetup/ledcAttachPin
; vs ledcAttach). This code uses the 2.x API. If you bump the platform version,
; the LED dimming code will fail to compile until you port it to the new API.

[env:esp32dev]
platform = espressif32@6.5.0    ; Arduino-ESP32 core 2.0.14
board = esp32dev               ; generic ESP32-WROOM-32 / ESP-32S dev board.
                                ; NOT esp-wrover-kit — that ID is for Espressif's
                                ; official WROVER-KIT hardware (different module,
                                ; has PSRAM, different peripherals). Using it on a
                                ; plain WROOM/ESP-32S board risks a PSRAM-init boot
                                ; failure since your board has no PSRAM chip.
framework = arduino
; OTA needs two app slots. default.csv has them (2 x 1.25 MB). Check the firmware
; size printed at the end of `pio run` stays comfortably under 1,310,720 bytes.
board_build.partitions = default.csv
monitor_speed = 115200
upload_speed = 921600
